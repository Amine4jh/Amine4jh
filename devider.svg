<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="1200" height="36">
  <defs>
    <!-- Main neon line -->
    <linearGradient id="ln" x1="0" x2="1">
      <stop offset="0" stop-color="#f7ea2a" stop-opacity="0"/>
      <stop offset=".18" stop-color="#f7ea2a" stop-opacity=".95"/>
      <stop offset=".42" stop-color="#00f7ff" stop-opacity=".95"/>
      <stop offset=".58" stop-color="#df2d3c" stop-opacity=".95"/>
      <stop offset=".82" stop-color="#f7ea2a" stop-opacity=".95"/>
      <stop offset="1" stop-color="#f7ea2a" stop-opacity="0"/>
    </linearGradient>

    <!-- Passing shine -->
    <linearGradient id="gl" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- Center glow -->
    <radialGradient id="cg" cx=".5" cy=".5" r=".55">
      <stop offset="0" stop-color="#f7ea2a" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#00f7ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#df2d3c" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="c">
      <rect x="0" y="15" width="1200" height="6" rx="3"/>
    </clipPath>

    <!-- Sandevistan-inspired center icon -->
    <symbol id="core" viewBox="0 0 40 40">
      <!-- outer broken ring -->
      <path d="M20 4
               A16 16 0 0 1 31.5 8.5"
            fill="none" stroke="#f7ea2a" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M35.2 16
               A16 16 0 0 1 33 27.5"
            fill="none" stroke="#00f7ff" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M27.5 33
               A16 16 0 0 1 16 35.2"
            fill="none" stroke="#df2d3c" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M8.5 31.5
               A16 16 0 0 1 4.8 20"
            fill="none" stroke="#00f7ff" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M6.8 12.8
               A16 16 0 0 1 14 5.4"
            fill="none" stroke="#f7ea2a" stroke-width="2.2" stroke-linecap="round"/>

      <!-- inner ring -->
      <circle cx="20" cy="20" r="7.2" fill="none" stroke="#f7ea2a" stroke-width="1.8"/>

      <!-- speed / sandevistan marks -->
      <path d="M14.5 20h11" fill="none" stroke="#00f7ff" stroke-width="2" stroke-linecap="round"/>
      <path d="M17 16.3l5.2 3.7-5.2 3.7" fill="none" stroke="#df2d3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- tiny accents -->
      <circle cx="20" cy="20" r="2" fill="#f7ea2a"/>
      <path d="M20 1.6v3.2M38.4 20h-3.2M20 38.4v-3.2M1.6 20h3.2"
            fill="none" stroke="#00f7ff" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
    </symbol>
  </defs>

  <style>
    .sh{animation:sh 3.4s linear infinite}
    .fk{animation:fk 4.8s infinite}
    .gl1{animation:gl1 2.6s ease-in-out infinite}
    .gl2{animation:gl2 2.6s ease-in-out infinite}
    .pulse{animation:pulse 2.2s ease-in-out infinite}
    @keyframes sh{
      from{transform:translateX(-220px)}
      to{transform:translateX(1220px)}
    }
    @keyframes fk{
      0%,100%{opacity:1}
      61%{opacity:1}
      62%{opacity:.45}
      64%{opacity:1}
      66%{opacity:.65}
      67%{opacity:1}
    }
    @keyframes gl1{
      0%,86%,100%{transform:translate(0,0)}
      88%{transform:translate(-2px,0)}
      91%{transform:translate(2px,0)}
      94%{transform:translate(-1px,0)}
    }
    @keyframes gl2{
      0%,86%,100%{transform:translate(0,0)}
      88%{transform:translate(2px,0)}
      91%{transform:translate(-2px,0)}
      94%{transform:translate(1px,0)}
    }
    @keyframes pulse{
      0%,100%{opacity:.55;transform:scale(1)}
      50%{opacity:.95;transform:scale(1.06)}
    }
  </style>

  <!-- subtle center glow -->
  <ellipse class="pulse" cx="600" cy="18" rx="58" ry="16" fill="url(#cg)"/>

  <!-- left and right lines -->
  <rect x="0" y="17" width="548" height="2" rx="1" fill="url(#ln)"/>
  <rect x="652" y="17" width="548" height="2" rx="1" fill="url(#ln)"/>

  <!-- extra red/cyan micro streaks near center -->
  <rect x="520" y="14" width="24" height="1.5" rx=".75" fill="#df2d3c" opacity=".65"/>
  <rect x="530" y="21" width="18" height="1.5" rx=".75" fill="#00f7ff" opacity=".7"/>
  <rect x="656" y="14" width="24" height="1.5" rx=".75" fill="#00f7ff" opacity=".65"/>
  <rect x="652" y="21" width="18" height="1.5" rx=".75" fill="#df2d3c" opacity=".7"/>

  <!-- shine pass -->
  <g clip-path="url(#c)">
    <rect class="sh" x="0" y="15" width="180" height="6" fill="url(#gl)"/>
  </g>

  <!-- glitch echo for the center icon -->
  <g class="fk">
    <g class="gl1" opacity=".38">
      <use href="#core" x="579" y="0" width="42" height="36" />
    </g>
    <g class="gl2" opacity=".28">
      <use href="#core" x="581" y="0" width="42" height="36" />
    </g>
  </g>

  <!-- main center icon -->
  <use href="#core" x="580" y="0" width="40" height="36"/>

</svg>