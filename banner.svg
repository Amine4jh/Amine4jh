<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Amine4jh cyberpunk Sandevistan animated banner">
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#05080d"/><stop offset=".46" stop-color="#0b1219"/><stop offset=".76" stop-color="#190d16"/><stop offset="1" stop-color="#080a12"/>
    </linearGradient>
    <radialGradient id="core"><stop stop-color="#faef34" stop-opacity=".17"/><stop offset=".55" stop-color="#00eaf7" stop-opacity=".06"/><stop offset="1" stop-color="#00eaf7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#67f6fa" stroke-opacity=".065"/></pattern>
    <pattern id="scan" width="3" height="4" patternUnits="userSpaceOnUse"><path d="M0 0H3" stroke="#000" stroke-opacity=".24"/></pattern>
    <linearGradient id="speed" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00f5ff" stop-opacity="0"/><stop offset=".55" stop-color="#00f5ff" stop-opacity=".9"/><stop offset="1" stop-color="#fff84b" stop-opacity="0"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="16"/></clipPath>
    <clipPath id="slice1"><rect x="260" y="101" width="680" height="14"/></clipPath>
    <clipPath id="slice2"><rect x="260" y="153" width="680" height="12"/></clipPath>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <style>
    .title{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:105px;font-weight:800;letter-spacing:-3px;text-anchor:middle}
    .subtitle{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:21px;font-weight:700;letter-spacing:1.2px;text-anchor:middle}
    .glyph{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace;font-size:29px;font-weight:800;text-anchor:middle}
    .ringA{transform-box:fill-box;transform-origin:center;animation:spin 12s linear infinite}
    .ringB{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite reverse}
    .ringC{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
    .trailA{animation:trail 2.6s ease-out infinite}
    .trailB{animation:trail 2.6s ease-out -1.3s infinite}
    .trailC{animation:trail 1.8s ease-out -.75s infinite}
    .ghostC{animation:ghostC 4.4s steps(1,end) infinite}
    .ghostR{animation:ghostR 4.4s steps(1,end) infinite}
    .sliceA{animation:sliceA 4.4s steps(1,end) infinite}
    .sliceB{animation:sliceB 4.4s steps(1,end) infinite}
    .flicker{animation:flicker 3.5s steps(1,end) infinite}
    .shift{animation:shift 2.8s ease-in-out infinite}
    .shift2{animation:shift 3.6s ease-in-out -1.2s infinite}
    .pulse{animation:pulse 2.2s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes trail{0%{transform:translateX(-65px) scaleX(.7);opacity:0}18%{opacity:.9}72%{opacity:.4}100%{transform:translateX(125px) scaleX(1.3);opacity:0}}
    @keyframes ghostC{0%,84%,92%,100%{transform:translate(0);opacity:.55}85%{transform:translate(-11px,2px);opacity:1}87%{transform:translate(8px,-2px);opacity:1}89%{transform:translate(-5px,1px);opacity:.8}}
    @keyframes ghostR{0%,84%,92%,100%{transform:translate(0);opacity:.5}85%{transform:translate(10px,-3px);opacity:1}87%{transform:translate(-7px,2px);opacity:1}89%{transform:translate(4px,-1px);opacity:.8}}
    @keyframes sliceA{0%,84%,92%,100%{opacity:0;transform:translateX(0)}85%,86%{opacity:1;transform:translateX(22px)}87%,90%{opacity:1;transform:translateX(-16px)}}
    @keyframes sliceB{0%,84%,92%,100%{opacity:0;transform:translateX(0)}85%,86%{opacity:1;transform:translateX(-24px)}87%,90%{opacity:1;transform:translateX(14px)}}
    @keyframes flicker{0%,78%,84%,100%{opacity:.8}79%,82%{opacity:.14}83%{opacity:1}}
    @keyframes shift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes pulse{0%,100%{opacity:.3}50%{opacity:.9}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <ellipse cx="600" cy="155" rx="500" ry="200" fill="url(#core)"/>
    <!-- Sandevistan activation: bottom-left circular accelerometer -->
    <g transform="translate(55 293)">
      <circle r="149" fill="none" stroke="#00eaff" stroke-width="17" opacity=".16" filter="url(#halo)"/>
      <g class="ringA" fill="none" stroke="#f9ee39" stroke-width="10" stroke-linecap="square" stroke-dasharray="117 25 35 62 85 93 20 110"><circle r="147"/></g>
      <g class="ringB" fill="none" stroke="#00efff" stroke-width="4" stroke-dasharray="74 12 14 42 97 45"><circle r="119"/></g>
      <g class="ringC" fill="none" stroke="#ff3650" stroke-width="3" stroke-dasharray="8 12 52 23 8 75"><circle r="94"/></g>
      <circle r="66" fill="none" stroke="#f9ee39" stroke-width="2" stroke-opacity=".55" stroke-dasharray="3 13"/>
      <path d="M-162 0H162M0-162V162" stroke="#00efff" stroke-opacity=".18"/>
    </g>
    <!-- Sandevistan activation: top-right elliptical neural time-ring -->
    <g transform="translate(1156 37)">
      <circle r="147" fill="none" stroke="#ff3650" stroke-width="17" opacity=".18" filter="url(#halo)"/>
      <g class="ringB" fill="none" stroke="#00efff" stroke-width="10" stroke-dasharray="108 24 18 70 90 22"><circle r="146"/></g>
      <g class="ringA" fill="none" stroke="#f9ee39" stroke-width="5" stroke-dasharray="50 17 110 33 17 24"><circle r="118"/></g>
      <g class="ringC" fill="none" stroke="#ff3650" stroke-width="3" stroke-dasharray="26 19 6 28"><circle r="89"/></g>
      <circle r="66" fill="none" stroke="#00efff" stroke-width="2" stroke-opacity=".5" stroke-dasharray="4 12"/>
      <path d="M-162 0H162M0-162V162" stroke="#ff3650" stroke-opacity=".2"/>
    </g>
    <!-- Afterimage speed streaks that replace original corner shards -->
    <g stroke-linecap="round" fill="none">
      <g class="trailA" stroke="url(#speed)"><path d="M-60 185H260" stroke-width="7"/><path d="M-100 202H208" stroke-width="2"/><path d="M-55 229H295" stroke-width="4"/></g>
      <g class="trailB" stroke="#f9ee39" stroke-opacity=".55"><path d="M-90 263H225" stroke-width="3"/><path d="M-30 288H310" stroke-width="2"/></g>
      <g class="trailC" stroke="#ff3650" stroke-opacity=".58"><path d="M938 54H1240" stroke-width="5"/><path d="M970 89H1260" stroke-width="2"/><path d="M990 122H1240" stroke-width="3"/></g>
      <g class="trailB" stroke="#00efff" stroke-opacity=".65"><path d="M907 22H1250" stroke-width="2"/><path d="M987 162H1260" stroke-width="4"/></g>
    </g>
    <!-- fractured time displacement / red cyberpsychosis pulse -->
    <g class="flicker" fill="none" stroke="#ff3b53" stroke-width="2" opacity=".7">
      <path d="M19 107h64l14-10h51M1052 227h60l13-12h57"/>
      <path d="M48 125h55M1060 244h83" stroke-dasharray="4 8"/>
    </g>
    <g class="pulse" fill="#ff3650"><rect x="97" y="137" width="28" height="3"/><rect x="1085" y="205" width="41" height="3"/><rect x="1004" y="193" width="17" height="2"/></g>
    <!-- coding glyphs, deliberately kept away from main text -->
    <g class="glyph" opacity=".82">
      <text class="shift" x="238" y="60" fill="#00efff">&lt;/&gt;</text>
      <text class="shift2" x="943" y="290" fill="#f9ee39">{ }</text>
      <text class="shift" x="301" y="265" fill="#ff3650">//</text>
      <text class="shift2" x="958" y="64" fill="#00efff">\</text>
    </g>
    <!-- high-contrast centered title + chromatic glitches -->
    <g class="ghostC"><text class="title" x="595" y="166" fill="#00efff">Amine4jh</text></g>
    <g class="ghostR"><text class="title" x="605" y="166" fill="#ff3650">Amine4jh</text></g>
    <text class="title" x="600" y="166" fill="#f8ef3b" stroke="#0b1116" stroke-width="1.5" paint-order="stroke">Amine4jh</text>
    <g clip-path="url(#slice1)"><g class="sliceA"><text class="title" x="600" y="166" fill="#ff3650">Amine4jh</text></g></g>
    <g clip-path="url(#slice2)"><g class="sliceB"><text class="title" x="600" y="166" fill="#00efff">Amine4jh</text></g></g>
    <!-- compact separator + user-requested stack -->
    <path d="M356 203H844" stroke="#f9ee39" stroke-width="2" stroke-opacity=".7"/>
    <path d="M344 203h7m498 0h7" stroke="#ff3650" stroke-width="4"/>
    <text class="subtitle" x="600" y="243" fill="#eff5f4">Full Stack <tspan fill="#ff3650">-</tspan> Laravel <tspan fill="#00efff">-</tspan> Next.js <tspan fill="#ff3650">-</tspan> Python</text>
    <!-- nonverbal edge tech / no extra labels -->
    <path d="M24 60V24h36M1140 24h36v36M24 260v36h36M1140 296h36v-36" fill="none" stroke="#f9ee39" stroke-width="2" opacity=".75"/>
    <g class="pulse" fill="#00efff"><circle cx="1108" cy="283" r="3"/><circle cx="1119" cy="283" r="2"/><circle cx="1130" cy="283" r="2"/></g>
    <rect width="1200" height="320" fill="url(#scan)" pointer-events="none"/>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="#f9ee39" stroke-opacity=".38" stroke-width="2"/>
</svg>
